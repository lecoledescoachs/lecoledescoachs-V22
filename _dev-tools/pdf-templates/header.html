<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0 40px; font-family: Helvetica, Arial, sans-serif; }
  .hwrap { overflow: hidden; padding-top: 6px; }
  .hlogo { float: left; width: 40px; height: 40px; border-radius: 50%; overflow: hidden; margin-right: 12px; }
  .hlogo img { width: 40px; height: 40px; }
  .htext { float: left; padding-top: 2px; }
  .hname { font-weight: 900; font-size: 12px; letter-spacing: 0.3px; color: #111; }
  .hsub { font-size: 9px; color: #666; font-weight: 700; }
  .hright { float: right; text-align: right; padding-top: 6px; font-size: 9px; color: #666; font-weight: 700; }
  .hrule { clear: both; height: 2px; background: #111111; margin-top: 8px; }
</style>
</head>
<body>
  <div class="hwrap">
    <div class="hlogo"><img src="img/logo-icon.png"></div>
    <div class="htext">
      <div class="hname">L'ÉCOLE DES COACHS</div>
      <!-- Adapter le sous-titre au document généré -->
      <div class="hsub">Nom du document</div>
    </div>
    <div class="hright">v1 &middot; lecoledescoachs.fr</div>
  </div>
  <div class="hrule"></div>
</body>
</html>
